# ==============================================================================
# BENALSAM NGINX REVERSE PROXY CONFIGURATION
# ==============================================================================
# Tüm mikroservisler için reverse proxy yapılandırması
# CORS desteği eklenmiş versiyon
# ==============================================================================

# Upstream definitions for all microservices
upstream admin_backend {
    server 127.0.0.1:3002;
    keepalive 32;
}

upstream elasticsearch_service {
    server 127.0.0.1:3006;
    keepalive 32;
}

upstream upload_service {
    server 127.0.0.1:3007;
    keepalive 32;
}

upstream listing_service {
    server 127.0.0.1:3008;
    keepalive 32;
}

upstream backup_service {
    server 127.0.0.1:3013;
    keepalive 32;
}

upstream cache_service {
    server 127.0.0.1:3014;
    keepalive 32;
}

upstream categories_service {
    server 127.0.0.1:3015;
    keepalive 32;
}

upstream search_service {
    server 127.0.0.1:3016;
    keepalive 32;
}

upstream realtime_service {
    server 127.0.0.1:3019;
    keepalive 32;
}

# CORS Origin Map - İzin verilen origin'ler
map $http_origin $cors_origin {
    default "";
    "http://localhost:3000" "$http_origin";
    "http://localhost:3003" "$http_origin";
    "http://localhost:5173" "$http_origin";
    "http://localhost:4173" "$http_origin";
    "http://localhost:8081" "$http_origin";
    "https://benalsam.com" "$http_origin";
    "https://www.benalsam.com" "$http_origin";
    "https://admin.benalsam.com" "$http_origin";
    ~^https://.*\.vercel\.app$ "$http_origin";
}

# HTTPS Server (Port 443)
server {
    server_name api.benalsam.com;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/benalsam-access.log;
    error_log /var/log/nginx/benalsam-error.log;

    # Client body size (for file uploads)
    client_max_body_size 10M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_http_version 1.1;

    # ==================== CATEGORIES SERVICE ====================
    location /api/v1/categories {
        # CORS Preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-API-Key, x-user-id' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        # CORS Headers for actual requests
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://categories_service;
    }

    # ==================== ADMIN BACKEND ====================
    location /api/v1/admin/ {
        # CORS Preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-API-Key, x-user-id' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        rewrite ^/api/v1/admin/(.*)$ /api/v1/$1 break;
        proxy_pass http://admin_backend;
    }

    # ==================== ELASTICSEARCH SERVICE ====================
    location /api/v1/elasticsearch/ {
        # CORS Preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-API-Key, x-user-id' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        rewrite ^/api/v1/elasticsearch/(.*)$ /api/v1/$1 break;
        proxy_pass http://elasticsearch_service;
    }

    # ==================== UPLOAD SERVICE ====================
    location /api/v1/upload/ {
        # CORS Preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-API-Key, x-user-id' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        rewrite ^/api/v1/upload/(.*)$ /api/v1/$1 break;
        proxy_pass http://upload_service;
        client_max_body_size 10M;
    }

    # Upload Service - Direct path
    location /upload/ {
        # CORS Preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-API-Key, x-user-id' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        rewrite ^/upload/(.*)$ /api/v1/upload/$1 break;
        proxy_pass http://upload_service;
        client_max_body_size 10M;
    }

    # ==================== LISTING SERVICE ====================
    location /api/v1/listings/ {
        # CORS Preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-API-Key, x-user-id' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        rewrite ^/api/v1/listings/(.*)$ /api/v1/$1 break;
        proxy_pass http://listing_service;
    }

    # ==================== BACKUP SERVICE ====================
    location /api/v1/backup/ {
        # CORS Preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-API-Key, x-user-id' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        rewrite ^/api/v1/backup/(.*)$ /api/v1/$1 break;
        proxy_pass http://backup_service;
    }

    # ==================== CACHE SERVICE ====================
    location /api/v1/cache/ {
        # CORS Preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-API-Key, x-user-id' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        rewrite ^/api/v1/cache/(.*)$ /api/v1/$1 break;
        proxy_pass http://cache_service;
    }

    # ==================== SEARCH SERVICE ====================
    location /api/v1/search/ {
        # CORS Preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-API-Key, x-user-id' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        rewrite ^/api/v1/search/(.*)$ /api/v1/$1 break;
        proxy_pass http://search_service;
    }

    # ==================== REALTIME SERVICE ====================
    location /api/v1/realtime/ {
        # CORS Preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, X-API-Key, x-user-id, Upgrade, Connection' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        rewrite ^/api/v1/realtime/(.*)$ /api/v1/$1 break;
        proxy_pass http://realtime_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ==================== HEALTH CHECK ====================
    location /health {
        access_log off;
        add_header 'Access-Control-Allow-Origin' '*' always;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ==================== ROOT ====================
    location / {
        add_header 'Access-Control-Allow-Origin' '*' always;
        return 200 "Benalsam API - All services are running\n";
        add_header Content-Type text/plain;
    }

    # SSL Configuration (managed by Certbot)
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.benalsam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.benalsam.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP to HTTPS Redirect
server {
    listen 80;
    server_name api.benalsam.com;

    if ($host = api.benalsam.com) {
        return 301 https://$host$request_uri;
    }

    return 404;
}
